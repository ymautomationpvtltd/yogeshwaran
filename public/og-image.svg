<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow circles -->
  <circle cx="950" cy="150" r="280" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="500" r="220" fill="#d4af37" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Monogram Brand Badge -->
  <g transform="translate(100, 100)">
    <rect width="56" height="56" rx="14" fill="#1e2129" stroke="#333742" stroke-width="1.5" />
    <text x="28" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f3e5ab" text-anchor="middle" letter-spacing="1">YM</text>
  </g>

  <!-- Subtitle / Tagline Pill -->
  <g transform="translate(180, 110)">
    <rect width="460" height="36" rx="18" fill="#1c1e24" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />
    <text x="230" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="2">INNOVATOR • ENTREPRENEUR • AUTOMATION PIONEER</text>
  </g>

  <!-- Main Headline Name -->
  <text x="100" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Yogeshwaran
  </text>

  <!-- Designation -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="url(#goldGrad)">
    Managing Director &amp; Founder – YM Automation Pvt Ltd
  </text>

  <!-- Description paragraph -->
  <text x="100" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#9ca3af">
    Autonomous Manufacturing • Industry 4.0 • IIoT • Mechatronics Systems
  </text>
  <text x="100" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#6b7280">
    Engineering next-generation smart factories and intelligent automation ecosystems.
  </text>

  <!-- Tech tags badges at bottom -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="140" height="38" rx="8" fill="#181a20" stroke="#2d3139" stroke-width="1" />
    <text x="70" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Robotics &amp; SPM</text>

    <rect x="155" y="0" width="140" height="38" rx="8" fill="#181a20" stroke="#2d3139" stroke-width="1" />
    <text x="225" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">PLC &amp; SCADA</text>

    <rect x="310" y="0" width="150" height="38" rx="8" fill="#181a20" stroke="#2d3139" stroke-width="1" />
    <text x="385" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">IIoT Telemetry</text>

    <rect x="475" y="0" width="160" height="38" rx="8" fill="#181a20" stroke="#2d3139" stroke-width="1" />
    <text x="555" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Smart Factory 4.0</text>
  </g>

  <!-- Right Side Accent Graphic -->
  <g transform="translate(860, 200)">
    <circle cx="120" cy="120" r="160" fill="none" stroke="#d4af37" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="120" cy="120" r="110" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1.5" />
    <circle cx="120" cy="120" r="60" fill="#181a20" stroke="#d4af37" stroke-width="2" />
    <text x="120" y="128" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">YM</text>
  </g>
</svg>
